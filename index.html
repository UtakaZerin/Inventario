<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inventario por sala</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F4F4EF; --panel:#FFFFFF; --ink:#18241F; --ink-soft:#5C6660;
  --line:#DEDED6; --accent:#27675A; --accent-soft:#E4EDE9;
  --alert:#A8481B; --alert-soft:#F6E8DF;
  --radius:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#111814; --panel:#18211C; --ink:#E9EDE9; --ink-soft:#97A29B;
    --line:#2A352E; --accent:#6FBFA8; --accent-soft:#1D2E28;
    --alert:#E2895C; --alert-soft:#31211A;
  }
}
:root[data-theme="dark"]{
  --paper:#111814; --panel:#18211C; --ink:#E9EDE9; --ink-soft:#97A29B;
  --line:#2A352E; --accent:#6FBFA8; --accent-soft:#1D2E28;
  --alert:#E2895C; --alert-soft:#31211A;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"Inter Tight","Helvetica Neue",Arial,sans-serif;
  font-size:16px; line-height:1.5; -webkit-text-size-adjust:100%;
}
.wrap{max-width:820px;margin:0 auto;padding:0 18px 72px}

header.top{
  border-bottom:1px solid var(--line); padding:18px 0 14px; margin-bottom:26px;
  display:flex; align-items:baseline; gap:12px; flex-wrap:wrap;
}
.mark{font-weight:700;letter-spacing:-.01em}
.mark span{color:var(--ink-soft);font-weight:500}

.hero{margin:0 0 26px}
.hero h1{
  font-size:clamp(30px,7vw,46px); line-height:1.05; letter-spacing:-.025em;
  margin:0 0 10px; font-weight:700;
}
.tally{display:flex;gap:10px;flex-wrap:wrap;align-items:center;color:var(--ink-soft);font-size:15px}
.pill{
  display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--accent);
  border-radius:999px;padding:3px 11px;font-weight:600;font-size:14px;
}
.pill.warn{background:var(--alert-soft);color:var(--alert)}

.search{
  display:flex;gap:8px;align-items:center;background:var(--panel);
  border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;margin:0 0 22px;
}
.search input{
  border:0;background:transparent;color:var(--ink);font:inherit;width:100%;outline:none;
  font-family:"IBM Plex Mono",monospace;letter-spacing:.02em;
}
.search input::placeholder{font-family:"Inter Tight",sans-serif;color:var(--ink-soft);letter-spacing:0}
.search svg{flex:none;color:var(--ink-soft)}

.group-h{
  font-size:13px;font-weight:600;color:var(--ink-soft);margin:26px 0 8px;
  display:flex;align-items:center;gap:10px;
}
.group-h::after{content:"";height:1px;flex:1;background:var(--line)}

.rows{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.row{display:grid;grid-template-columns:64px 80px 1fr;gap:12px;padding:12px 14px;border-top:1px solid var(--line);align-items:start}
.row:first-child{border-top:0}
.row.hit{background:var(--accent-soft)}
.row.no-img{grid-template-columns:96px 1fr}
.thumb{
  width:80px;height:80px;border-radius:8px;object-fit:cover;background:var(--accent-soft);
  border:1px solid var(--line);cursor:zoom-in;display:block;
}
.code{
  font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:16px;
  letter-spacing:-.01em;color:var(--accent);padding-top:1px;word-break:break-all;
}
.desc{margin:0;font-size:15.5px}
.obs{margin:4px 0 0;font-size:13.5px;color:var(--ink-soft)}
.obs.warn{color:var(--alert);font-weight:500}

.lightbox{
  position:fixed;inset:0;background:rgba(0,0,0,.82);display:none;
  align-items:center;justify-content:center;padding:24px;z-index:50;
}
.lightbox.open{display:flex}
.lightbox img{max-width:100%;max-height:100%;border-radius:10px}

nav.salas{margin-top:38px;border-top:1px solid var(--line);padding-top:18px}
nav.salas p{font-size:13px;color:var(--ink-soft);margin:0 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  display:inline-block;padding:7px 13px;border:1px solid var(--line);border-radius:999px;
  background:var(--panel);color:var(--ink);text-decoration:none;font-size:14.5px;
}
.chip[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:var(--paper);font-weight:600}
.chip:focus-visible,.search:focus-within{outline:2px solid var(--accent);outline-offset:2px}

footer{margin-top:34px;font-size:13px;color:var(--ink-soft);line-height:1.6}
.empty{padding:26px 14px;color:var(--ink-soft);text-align:center}
@media (max-width:420px){
  .row{grid-template-columns:82px 1fr;gap:10px}
  .code{font-size:15.5px}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="mark">Inventario <span>· mobiliario</span></div>
  </header>

  <div class="hero">
    <h1 id="titulo">Inventario</h1>
    <div class="tally" id="tally"></div>
  </div>

  <label class="search">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" inputmode="numeric" placeholder="Buscar por número de inventario o descripción" aria-label="Buscar en el inventario">
  </label>

  <main id="lista"></main>

  <nav class="salas">
    <p>Ver otra sala</p>
    <div class="chips" id="chips"></div>
  </nav>

  <footer>
    Cada número corresponde al sticker pegado en el objeto. Si un objeto no aparece aquí o está en otra sala, repórtalo para actualizar el inventario.
  </footer>
</div>

<div class="lightbox" id="lightbox">
  <img id="lightbox-img" src="" alt="">
</div>

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const warn = o => o && !/buen estado/i.test(o);

function salaActual(){
  const h = decodeURIComponent(location.hash.replace('#',''));
  return SALAS.find(s => s.slug === h) || null;
}

function render(){
  const sala = salaActual();
  const q = document.getElementById('q').value.trim().toLowerCase();
  const items = sala ? sala.items : SALAS.flatMap(s => s.items);
  const vistos = q ? items.filter(i =>
      i.num.toLowerCase().includes(q) || i.desc.toLowerCase().includes(q)) : items;

  document.getElementById('titulo').textContent = sala ? sala.nombre : 'Inventario completo';
  const novedades = vistos.filter(i => warn(i.obs)).length;
  document.getElementById('tally').innerHTML =
    `<span class="pill">${vistos.length} objeto${vistos.length===1?'':'s'}</span>` +
    (novedades ? `<span class="pill warn">${novedades} con novedad</span>` : '') +
    (q ? `<span>resultado de la búsqueda</span>` : (sala ? '' : `<span>en ${SALAS.length} ubicaciones</span>`));

  const grupos = {};
  vistos.forEach(i => {
    const k = sala || q ? i.cat : i.ub;
    (grupos[k] = grupos[k] || []).push(i);
  });

  const lista = document.getElementById('lista');
  if (!vistos.length){
    lista.innerHTML = `<div class="rows"><p class="empty">Ningún objeto coincide con “${esc(q)}”. Prueba con el número completo del sticker.</p></div>`;
  } else {
    lista.innerHTML = Object.entries(grupos).map(([g, arr]) => `
      <h2 class="group-h">${esc(g)}</h2>
      <div class="rows">${arr.map(i => `
        <div class="row${q && i.num.toLowerCase()===q ? ' hit' : ''}${i.img ? '' : ' no-img'}">
          ${i.img ? `<img class="thumb" src="${esc(i.img)}" alt="Foto de ${esc(i.desc)}" loading="lazy" onclick="openLightbox('${esc(i.img)}')">` : ''}
          <div class="code">${esc(i.num)}</div>
          <div>
            <p class="desc">${esc(i.desc)}</p>
            <p class="obs${warn(i.obs)?' warn':''}">${esc(i.obs || 'Sin observación')}</p>
            ${sala ? '' : `<p class="obs">${esc(i.ub)}</p>`}
          </div>
        </div>`).join('')}</div>`).join('');
  }

  document.getElementById('chips').innerHTML =
    SALAS.map(s => `<a class="chip" href="#${s.slug}"${sala && sala.slug===s.slug?' aria-current="true"':''}>${esc(s.nombre)} <span style="opacity:.6">${s.items.length}</span></a>`).join('') +
    `<a class="chip" href="#todo"${!sala?' aria-current="true"':''}>Todas</a>`;
}

function openLightbox(src){
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').classList.add('open');
}
document.getElementById('lightbox').addEventListener('click', () => {
  document.getElementById('lightbox').classList.remove('open');
});

addEventListener('hashchange', () => { document.getElementById('q').value=''; render(); scrollTo(0,0); });
document.getElementById('q').addEventListener('input', render);
render();
</script>
